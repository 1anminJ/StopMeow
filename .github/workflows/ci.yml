name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: macOS 앱 빌드
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build

  server:
    name: 갤러리 서버 테스트
    runs-on: ubuntu-latest # Testcontainers가 쓸 Docker가 기본 설치되어 있음
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
