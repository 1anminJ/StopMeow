spring.application.name=server

# 로컬 개발: server/compose.yaml의 PostgreSQL (docker compose up -d)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/stopmeow}
spring.datasource.username=${DB_USER:stopmeow}
spring.datasource.password=${DB_PASSWORD:stopmeow}
spring.sql.init.mode=always

# ResponseStatusException 사유(예: 업로드 횟수 초과)를 앱에서 그대로 보여주기 위해 응답에 포함
server.error.include-message=always
